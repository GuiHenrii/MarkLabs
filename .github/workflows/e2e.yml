name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: v3-monorepo/package.json

      - name: Install dependencies
        run: cd v3-monorepo && pnpm install

      - name: Install Playwright Browsers
        run: cd v3-monorepo/apps/web && npx playwright install --with-deps

      - name: Build Web App
        run: cd v3-monorepo && pnpm --filter apps/web build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/marklabs
          NEXTAUTH_SECRET: secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Run Playwright tests
        run: cd v3-monorepo/apps/web && npx playwright test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/marklabs
          NEXTAUTH_SECRET: secret
          NEXTAUTH_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: v3-monorepo/apps/web/playwright-report/
          retention-days: 30
